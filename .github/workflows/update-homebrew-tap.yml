# This file was generated by AI.
name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published compiler release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  update-tap:
    name: Open Homebrew tap pull request
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'matcha-compiler-v')
    runs-on: macos-14

    steps:
      - name: Check out Matcha release tools
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: matcha

      - name: Validate published compiler release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: matcha/scripts/release/validate-published-release "$TAG" "$GITHUB_REPOSITORY"

      - name: Require tap credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: mario-nowak/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          fetch-depth: 0
          path: tap

      - name: Update formula and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MATCHA_GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: matcha/scripts/release/update-tap "$VERSION" "$TAG" "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE/tap"
