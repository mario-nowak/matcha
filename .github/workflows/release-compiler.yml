# This file was generated by AI.
name: Release compiler

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Compiler semantic version without a leading v
        required: true
        type: string
      dry_run:
        description: Rehearse the release without publishing it
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-compiler-${{ github.event_name == 'workflow_dispatch' && 'manual' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.release.outputs.base_sha }}
      release_complete: ${{ steps.release.outputs.release_complete }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive and validate release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: scripts/release/prepare-candidate

      - name: Show candidate version changes
        run: git diff --check && git diff -- matcha-compiler/build.zig matcha-compiler/build.zig.zon matcha-compiler/README.md

      - name: Install system dependencies
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y clang libgc-dev

      - name: Set up mise toolchain
        if: github.event_name == 'workflow_dispatch'
        uses: jdx/mise-action@v3
        with:
          working_directory: matcha-compiler

      - name: Verify release candidate
        if: github.event_name == 'workflow_dispatch'
        working-directory: matcha-compiler
        run: mise run verify

  build:
    name: Build ${{ matrix.platform_name }} release candidate
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            platform_name: Linux x86_64
            arch: x86_64
          - os: macos-14
            platform: macos
            platform_name: macOS arm64
            arch: arm64

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set release candidate version
        run: scripts/release/set-compiler-version "${{ needs.prepare.outputs.version }}"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build compiler
        working-directory: matcha-compiler
        run: zig build -Doptimize=ReleaseFast

      - name: Package and smoke-test release archive
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/package-compiler "$VERSION" "$PLATFORM" "$ARCH" "$RUNNER_TEMP"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: matcha-compiler-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  rehearse:
    name: Rehearse release bundle and Homebrew formula
    needs: [prepare, build]
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-${{ needs.prepare.outputs.version }}-*-${{ github.run_attempt }}
          path: dist
          merge-multiple: true

      - name: Generate and verify release bundle
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/verify-bundle "$VERSION" dist "$RUNNER_TEMP/matcha-lang.rb"

  create-draft:
    name: Create compiler draft prerelease
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    needs: [prepare, build, rehearse]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-${{ needs.prepare.outputs.version }}-*-${{ github.run_attempt }}
          path: dist
          merge-multiple: true

      - name: Create release commit and tag
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/publish-version "$VERSION" "$TAG" "$BASE_SHA"

      - name: Generate release checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/generate-checksums "$VERSION" dist

      - name: Create GitHub draft prerelease
        if: needs.prepare.outputs.release_complete != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Matcha Compiler v${{ needs.prepare.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/matcha-compiler-v${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
            dist/matcha-compiler-v${{ needs.prepare.outputs.version }}-macos-arm64.tar.gz
            dist/SHA256SUMS.txt
