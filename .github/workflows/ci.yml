# This file was generated by AI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-automation:
    name: Release automation checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test release tools
        run: scripts/tests/release-tools-test.sh

      - name: Lint release shell scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 scripts/release/* scripts/tests/release-tools-test.sh

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  lint-ubuntu:
    name: Formatting checks (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Run formatting checks
        working-directory: matcha-compiler
        run: zig fmt --check .

  test-ubuntu:
    name: Compiler and E2E tests (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgc-dev

      - name: Run compiler tests
        working-directory: matcha-compiler
        run: zig build unit-test --summary all

      - name: Run end-to-end tests
        working-directory: matcha-compiler
        run: zig build e2e --summary all
