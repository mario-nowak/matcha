min_version = "2026.4.15"

[env]
_.path = [
  "/opt/homebrew/opt/llvm@20/bin",
  "/usr/local/opt/llvm@20/bin",
]

[tools]
zig = "0.15.1"
zls = "0.15.1"

[tasks.check]
description = "Check that the Matcha compiler compiles"
run = "zig build check"

[tasks.build]
description = "Build the Matcha compiler"
run = "zig build"

[tasks.lint]
description = "Run Matcha formatting checks"
run = "zig fmt --check ."

[tasks.test-compiler]
description = "Run Matcha compiler tests"
usage = 'arg "[filter]..." var=#true help="Only run tests whose names match one of these filters"'
# mise passes the filters as one shell-quoted string, so `eval` splits them back into arguments.
run = '''
eval "set -- $usage_filter"
for filter in "$@"; do set -- "$@" "-Dtest-filter=$filter"; shift; done
zig build unit-test --summary all "$@"
'''

[tasks.test]
description = "Run all Matcha tests"
run = "zig build test --summary all"

[tasks.e2e]
description = "Run Matcha end-to-end tests"
run = "zig build e2e --summary all"

[tasks.verify]
description = "Run the full local verification workflow"
run = "mise run lint && mise run build && mise run test-compiler && mise run e2e"

[tasks.checkfix]
description = "Format the repo, then run full verification"
run = "zig fmt . && mise run verify"

[tasks.build-compiler]
description = "Build an optimized matcha compiler binary"
run = "zig build -Doptimize=ReleaseFast"
